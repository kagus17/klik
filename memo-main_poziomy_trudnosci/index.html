<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="styles.css" rel="stylesheet">
  <script src="script.js" async></script>
  <title>Klik</title>
</head>
<body onselectstart="return false;">
  <h1 class="page-title">
    <img src="Assets/Images/logo.png" alt="Logo Klik" class="logo-img">
  </h1>
  
  <div class="overlay-text visible">
    Naciśnij aby rozpocząć
  </div>
  <div id="game-over-text" class="overlay-text">
    Koniec gry
    <span class="overlay-text-small">Naciśnij aby ponownie rozpocząć grę</span>
  </div>
  <div id="victory-text" class="overlay-text">
    Zwycięstwo
    <span class="overlay-text-small">Naciśnij aby ponownie rozpocząć grę</span>
  </div>

  <div class="game-container">
    <div class="game-info-container">
      <div class="game-info">
        Czas <span id="time-remaining">100</span>
      </div>
      <div class="game-info">
        Odwrócenia <span id="flips">0</span>
      </div>
    </div>

    <!-- Tylko ten kontener na karty! -->
    <div id="game-container"></div>
  </div>

</body>
</html>
