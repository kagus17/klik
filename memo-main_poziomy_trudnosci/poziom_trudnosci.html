<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Wybierz poziom – Wiśniowa Memo</title>
  <style>
    body {
      font-family: Jazz LET, fantasy;
      background: radial-gradient(#ffd9de, #3c0001);
      color: #3c0001;
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      font-size: 4em;
      margin-bottom: 40px;
    }

    .btn {
      display: block;
      width: 200px;
      margin: 20px auto;
      padding: 15px;
      font-size: 1.5em;
      background-color: #ffd9de;
      border: 3px solid #3c0001;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>Wybierz poziom</h1>

  <button class="btn" onclick="startGame('easy')">Łatwy (3 pary)</button>
  <button class="btn" onclick="startGame('medium')">Średni (6 par)</button>
  <button class="btn" onclick="startGame('hard')">Trudny (12 par)</button>

  <script>
    function startGame(difficulty) {
      localStorage.setItem('memoDifficulty', difficulty);
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
