<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="styles.css" rel="stylesheet">
  <title>Wybierz poziom trudności</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #1c1c1c, #3a3a3a);
      color: white;
      font-family: "Noto Sans", sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 30px;
    }

    .difficulty-button {
      font-size: 1.5em;
      padding: 15px 40px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      background-color: #955f46;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .difficulty-button:hover {
      background-color: #b57c64;
    }
  </style>
</head>
<body>
  <h1>Wybierz poziom trudności</h1>
  <button class="difficulty-button" onclick="setDifficulty('easy')">Łatwy</button>
  <button class="difficulty-button" onclick="setDifficulty('medium')">Średni</button>
  <button class="difficulty-button" onclick="setDifficulty('hard')">Trudny</button>

  <script>
    function setDifficulty(level) {
      localStorage.setItem('memoDifficulty', level);
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
