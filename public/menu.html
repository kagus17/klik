<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Menu gry</title>
  <style>
    body {
      font-family: Jazz LET, fantasy;
      background: radial-gradient(#ffd9de, #3c0001);
      color: #3c0001;
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      font-size: 4em;
      margin-bottom: 40px;
    }

    .btn {
      display: block;
      width: 200px;
      margin: 20px auto;
      padding: 15px;
      font-size: 1.5em;
      background-color: #ffd9de;
      border: 3px solid #3c0001;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>Witaj w grze 1v1</h1>

  <div id="status"></div>

  <button id="create-room">Utwórz pokój</button>
<div class="difficulty-select">
<h3></h3>
  <label for="difficulty">Wybierz poziom trudności:</label>
  <select id="difficulty">
    <option class="btn" value="easy">Łatwy (3 pary)</option>
    <option class="btn" value="medium" selected>Średni (6 par)</option>
    <option class="btn" value="hard">Trudny (12 par)</option>
  </select>
</div>

  <h3>Lub dołącz do istniejącego pokoju</h3>
  <form id="join-form">
    <input type="text" name="code" placeholder="Kod pokoju" required maxlength="6">
    <button type="submit">Dołącz</button>
  </form>
  <button id="logout">Wyloguj</button>

  <script>
    const status = document.getElementById('status');

    // Sprawdź, czy użytkownik jest zalogowany
    (async () => {
    const res = await fetch('/session/check');
    const data = await res.json();

    if (!data.loggedIn) {
      alert('Musisz być zalogowany!');
      window.location.href = '/index.html';
    } else {
      status.innerText = `Zalogowany jako: ${data.username}`;
    }
    })();

    document.getElementById('create-room').addEventListener('click', async () => {
      const difficulty = document.getElementById('difficulty').value; // Pobierz wybrany poziom trudności
      const res = await fetch('/room/create', { method: 'POST' });
      const data = await res.json();

      if (data.success) {
        // Tu można przekierować do strony gry: np. /game.html?code=XYZ123
        window.location.href = `/game2.html?code=${data.code}&difficulty=${difficulty}`; // Dodaj poziom trudności do URL
      } else {
        status.innerText = 'Nie udało się utworzyć pokoju.';
      }
    });

    document.getElementById('join-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const res = await fetch('/room/join', {
        method: 'POST',
        body: new URLSearchParams(formData)
      });

      const data = await res.json();

      if (data.success) {
        status.innerText = 'Dołączono do pokoju!';
        // Tu można przekierować do gry
        window.location.href = `/game2.html?code=${formData.get('code')}`;
      } else {
        status.innerText = 'Błąd: Nie udało się dołączyć do pokoju.';
      }
    });

    document.getElementById('logout').addEventListener('click', async () => {
    await fetch('/auth/logout', { method: 'POST' });
    window.location.href = '/index.html';
    });

  </script>
</body>
</html>
