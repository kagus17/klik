<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="styles.css" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js" async></script>
  <title>KLIK | Gra 1 vs 1</title>
</head>
<body onselectstart="return false;">
  <div class="overlay-text visible" id="waiting-overlay">
    <div id="room-code-display" style="cursor:pointer" title="Kliknij, aby skopiować kod">Kod pokoju: Ładowanie...</div>
    <div id="waiting-message">Oczekiwanie na przeciwnika...</div>
</div>
  <div id="game-over-text" class="overlay-text">
    Koniec gry
    <span class="overlay-text-small">Naciśnij aby ponownie rozpocząć gre</span>
  </div>
  <div id="victory-text" class="overlay-text">
    Zwycięstwo
    <span class="overlay-text-small">Naciśnij aby ponownie rozpocząć gre</span>
  </div>

  <!-- Results Modal -->
  <div id="results-modal" class="overlay-text hidden">
    <h2 id="results-title">Wyniki</h2>
    <p id="results-flips"></p>
    <p id="results-time"></p>
    <p id="results-matches"></p>
    <button id="return-to-menu">Wróć do menu</button>
  </div>

  <div class="game-container-data">
    <div class="game-info">
      <span id="difficulty-display">Poziom trudności: Ładowanie...</span>
    </div>
    <div class="game-info-container">
        <div class="game-info">
            Czas <span id="time-remaining">100 </span>
        </div>
        <div class="game-info">
            Twoje odwrócenia <span id="flips">0 </span>
        </div>
        <div class="game-info" id="opponent-info" style="display: none;">
          Odwrócenia <span id="opponent-name">Przeciwnika</span>:<span id="opponent-flips">0 </span>
        </div>
    </div>
  </div>

    <!-- Dynamic Card Container -->
    <div id="game-container"></div>
      <!-- Karty będą generowane dynamicznie przez JavaScript -->
    </div>

    <div id="notification" style="position:fixed;top:20px;right:20px;z-index:1000;display:none;background:#333;color:#fff;padding:12px 24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.2);font-size:1.1em;"></div>

 <script>
    // Event listener for "Return to Menu" button
    document.getElementById('return-to-menu').addEventListener('click', () => {
      window.location.href = '/menu.html';
    });

    // Kopiowanie kodu pokoju do schowka po kliknięciu
  document.getElementById('room-code-display').addEventListener('click', function () {
    // Pobierz kod pokoju z tekstu (np. "Kod pokoju: ABC123")
    const codeText = this.textContent;
    const code = codeText.split(':')[1]?.trim();
    if (code && code !== 'Ładowanie...') {
      navigator.clipboard.writeText(code).then(() => {
        this.textContent = `Skopiowano: ${code}`;
        setTimeout(() => {
          this.textContent = codeText;
        }, 1500);
      });
    }
  });
  </script>
</body>
</html>
