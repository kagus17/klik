<!DOCTYPE html>
<!-- Strona resetowania hasła, umożliwiająca użytkownikowi wprowadzenie nowego hasła z użyciem tokenu. -->
<html lang="pl">
<head>
  <!-- Metadane i zasoby strony -->
  <meta charset="UTF-8">
  <link rel="stylesheet" href="toastify.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <link rel="stylesheet" href="recoverFinal.css">
  <title>KLIK | Reset hasła</title>
</head>
<body>
   <!-- Sekcja formularza resetowania hasła -->

	<div class="background">
    <div class="logo-container">
        <img src="logo.png" alt="Logo" class="logo-img">
    </div>

  <h1>Reset hasła</h1>
   <!-- Formularz resetowania hasła -->
  <form id="reset-form">
	<div class="recover-info">Użytkowniku, tutaj wpisz swoje nowe hasło.</div>
    <!-- Pole wprowadzania nowego hasła -->
	<div class="input-space">
  <div class="password-row">
    <input type="password" id="password" name="newPassword" placeholder="Nowe hasło" required>
  </div>
  <input type="password" id="confirm-password" name="ConfirmPassword" placeholder="Potwierdź hasło" required>
</div>
    <!-- Przycisk wysyłania formularza -->
    <button type="submit" class="btn">Zresetuj hasło</button>
  </form>

  <!-- Element wyświetlający status operacji -->
  <div id="status"></div>
  
  <!-- Skrypt Toastify (dodaj przed reset.js) -->
  <script src="toastify.js"></script>

  <!-- Skrypt dla przycisku pokaż/ukryj hasło -->
  <script src="toggle.js"></script>

  <!-- Skrypt resetu hasła -->
  <script src="reset.js"></script>
</body>
</html>
