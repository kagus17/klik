<!DOCTYPE html>
<html lang="pl">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <meta charset="UTF-8">
  <link rel="stylesheet" href="login_main.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';">
  <title>KLIK | Logowanie/Rejestracja</title>
</head>
<body>
  
  <!-- Sekcja logowania -->
  <div class="background">
    <h1>Zaloguj się</h1>
    <form id="login-form">
      <div class="input-space">
        <input type="text" name="username" placeholder="Login" id="login" required>
      </div>
      <div class="input-space">
        <input type="password" name="password" placeholder="Hasło" required>
      </div>
      <button type="submit" class="btn">Zaloguj</button>
    </form>
    <div class="forgot-password">
      Nie pamiętasz hasła? <a href="recovery_passwd.html"><b>Przypomnij</b></a>
    </div>
  </div>


  <!-- Logo -->
  <div class="logo-container">
    <img src="logo.png" alt="Logo" class="logo-img">
  </div>

  <!-- Sekcja rejestracji -->
  <div class="register background">
    <h1>Rejestracja</h1>
    <form id="register-form">
      <div class="input-space">
        <div class="upper-form">
          <input type="text" name="username" placeholder="Login" required>
          <input type="password" name="password" placeholder="Hasło" required>
        </div>
      </div>
      <div class="input-space" id="email">
        <input type="email" name="email" placeholder="Email" required>
      </div>
      <button type="submit" class="btn">Zarejestruj</button>
    </form>
  </div>

  <!-- Status komunikatów -->
  <div id="status"></div>

  <!-- Skrypty -->
  <script src="index.js"></script>
</body>
</html>
